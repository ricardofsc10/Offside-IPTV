name: Release

# Pushing a tag such as v0.3.0 builds the signed APK and publishes it as a GitHub release.
# Repository secrets needed:
#   KEYSTORE_BASE64   the release keystore, base64-encoded
#   KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4

      - name: Check the tag matches versionName
        run: |
          version=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match versionName $version"
            exit 1
          fi

      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          # Without the key the build comes out unsigned, and an unsigned APK doesn't install.
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "Missing signing secrets"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > app/release.jks
          {
            echo "storeFile=release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      # Releases are rare, so the tests run again here: a tag never ships a build that fails them.
      - name: Tests and release build
        timeout-minutes: 20
        run: ./gradlew testDebugUnitTest assembleRelease

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Always the same name, so releases/latest/download/offside-iptv.apk is the newest version
          # and the short link in the README never changes.
          apk="offside-iptv.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          # The mapping turns the obfuscated crash traces in diagnostic reports back into real names.
          cp app/build/outputs/mapping/release/mapping.txt "mapping-${GITHUB_REF_NAME}.txt"
          # Hand-written notes for this version when they exist, the list of changes otherwise.
          notes="docs/releases/${GITHUB_REF_NAME}.md"
          if [ -f "$notes" ]; then set -- --notes-file "$notes"; else set -- --generate-notes; fi
          gh release create "$GITHUB_REF_NAME" "$apk" "mapping-${GITHUB_REF_NAME}.txt" \
            --title "Offside IPTV ${GITHUB_REF_NAME#v}" "$@"

      - name: Remove the signing key
        if: always()
        run: rm -f app/release.jks keystore.properties
